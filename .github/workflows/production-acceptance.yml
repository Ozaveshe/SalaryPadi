name: Production acceptance

# Proves that the DEPLOYED customer surface matches the expected commit and
# exposes no internal diagnostics. The suite never skips a data-dependent
# assertion against a real deployment, and the run refuses to report a result
# unless the tested commit matches the expected one.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Target base URL
        required: false
        default: https://salarypadi.com
      expected_commit:
        description: Expected commit SHA (defaults to current main)
        required: false
      job_slug:
        description: Pinned acceptance job slug (optional override)
        required: false
      company_slug:
        description: Pinned acceptance company slug (optional override)
        required: false
  schedule:
    # Once daily; production data changes under us, so drift shows up here.
    - cron: "35 6 * * *"
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# Superseded runs are cancelled rather than queued. This workflow verifies the
# DEPLOYED surface, so once a newer commit is live the older run is verifying
# something that is no longer in production — it would spend its 20-minute
# commit-match budget polling for a commit production has already moved past.
#
# Queuing them also concentrates traffic: on 2026-08-03 five runs inside 95
# minutes put enough sustained load on one datacenter IP that Netlify's bot
# protection challenged the runner (403) and failed run 30779783574.
concurrency:
  group: production-acceptance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  acceptance:
    name: Verify deployed production surface
    runs-on: ubuntu-latest
    # After a CI run, only proceed when that run succeeded.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 30
    env:
      BASE_URL: ${{ inputs.base_url || 'https://salarypadi.com' }}
      # On schedule/workflow_run these inputs do not exist and arrive as empty
      # strings; the suite treats blank as "use the pinned default".
      PRODUCTION_ACCEPTANCE_JOB_SLUG: ${{ inputs.job_slug }}
      PRODUCTION_ACCEPTANCE_COMPANY_SLUG: ${{ inputs.company_slug }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Determine expected commit
        id: expected
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.expected_commit }}" ]; then
            EXPECTED="${{ inputs.expected_commit }}"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            EXPECTED="${{ github.event.workflow_run.head_sha }}"
          else
            EXPECTED="$(git rev-parse HEAD)"
          fi
          SHORT="$(printf '%s' "$EXPECTED" | cut -c1-7 | tr 'A-Z' 'a-z')"
          echo "sha=$EXPECTED" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "Expected production commit: $SHORT"

      - name: Wait for production to serve the expected commit
        id: match
        run: |
          set -euo pipefail
          EXPECTED="${{ steps.expected.outputs.short }}"
          ATTEMPTS=40          # 40 x 30s = 20 minutes maximum
          SLEEP=30
          DEPLOYED=""
          for i in $(seq 1 "$ATTEMPTS"); do
            BODY="$(curl -fsS --max-time 20 "$BASE_URL/api/build-info" || echo '{}')"
            DEPLOYED="$(printf '%s' "$BODY" | jq -r '.commit // empty')"
            CONTEXT="$(printf '%s' "$BODY" | jq -r '.context // "unknown"')"
            echo "attempt $i/$ATTEMPTS: deployed=${DEPLOYED:-none} context=$CONTEXT expected=$EXPECTED"
            if [ "$DEPLOYED" = "$EXPECTED" ]; then
              echo "deployed=$DEPLOYED" >> "$GITHUB_OUTPUT"
              echo "context=$CONTEXT" >> "$GITHUB_OUTPUT"
              echo "matched=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep "$SLEEP"
          done
          echo "deployed=${DEPLOYED:-none}" >> "$GITHUB_OUTPUT"
          echo "matched=false" >> "$GITHUB_OUTPUT"
          echo "::error::Production never reached the expected commit $EXPECTED (last seen: ${DEPLOYED:-none}). Not reporting acceptance."
          exit 1

      - name: Run production acceptance suite
        id: acceptance
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.BASE_URL }}
          PRODUCTION_ACCEPTANCE: "true"
        run: |
          npx playwright test tests/e2e/production-acceptance.spec.ts \
            --project=mobile-360 --project=desktop-chromium

      - name: Record tested environment
        if: always()
        run: |
          mkdir -p output/acceptance
          cat > output/acceptance/production-run.json <<JSON
          {
            "targetUrl": "${{ env.BASE_URL }}",
            "expectedCommit": "${{ steps.expected.outputs.short }}",
            "testedCommit": "${{ steps.match.outputs.deployed }}",
            "deployContext": "${{ steps.match.outputs.context }}",
            "commitMatched": ${{ steps.match.outputs.matched || false }},
            "testedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "workflowRun": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          JSON
          cat output/acceptance/production-run.json

      - name: Upload acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-acceptance-${{ steps.expected.outputs.short }}
          path: |
            output/acceptance/**
            output/playwright/**
            playwright-report/**
          retention-days: 14
          if-no-files-found: warn

      - name: Publish job summary
        if: always()
        run: |
          {
            echo "## Customer surface"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Target | ${{ env.BASE_URL }} |"
            echo "| Expected commit | \`${{ steps.expected.outputs.short }}\` |"
            echo "| Tested commit | \`${{ steps.match.outputs.deployed }}\` |"
            echo "| Commit matched | ${{ steps.match.outputs.matched || 'false' }} |"
            echo "| Deploy context | ${{ steps.match.outputs.context }} |"
            echo "| Suite result | ${{ steps.acceptance.outcome }} |"
            echo "| Projects | mobile-360, desktop-chromium |"
            echo
            if [ "${{ steps.match.outputs.matched }}" != "true" ]; then
              echo "> Acceptance was NOT reported: production did not reach the expected commit."
            elif [ "${{ steps.acceptance.outcome }}" != "success" ]; then
              echo "> Acceptance FAILED against the matching production commit. See artifacts for HTML, screenshots and traces."
            else
              echo "> Acceptance passed against the matching production commit. No test was skipped."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Customer-surface acceptance and operational health stay conceptually
  # separate — a page can read perfectly on a degraded platform. But the
  # workflow as a whole must not report a healthy release while /api/health is
  # returning 503, which is exactly what happened on 53318fa: acceptance went
  # green while every worker-health row was invisible and the jobs canary was
  # failing on the same commit.
  platform-health:
    name: Verify deployed platform health
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 30
    env:
      BASE_URL: ${{ inputs.base_url || 'https://salarypadi.com' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Determine expected commit
        id: expected
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.expected_commit }}" ]; then
            EXPECTED="${{ inputs.expected_commit }}"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            EXPECTED="${{ github.event.workflow_run.head_sha }}"
          else
            EXPECTED="$(git rev-parse HEAD)"
          fi
          echo "short=$(printf '%s' "$EXPECTED" | cut -c1-7 | tr 'A-Z' 'a-z')" >> "$GITHUB_OUTPUT"

      - name: Wait for production to serve the expected commit
        id: match
        run: |
          set -euo pipefail
          EXPECTED="${{ steps.expected.outputs.short }}"
          for i in $(seq 1 40); do
            BODY="$(curl -fsS --max-time 20 "$BASE_URL/api/build-info" || echo '{}')"
            DEPLOYED="$(printf '%s' "$BODY" | jq -r '.commit // empty')"
            echo "attempt $i/40: deployed=${DEPLOYED:-none} expected=$EXPECTED"
            if [ "$DEPLOYED" = "$EXPECTED" ]; then
              echo "deployed=$DEPLOYED" >> "$GITHUB_OUTPUT"
              echo "matched=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 30
          done
          echo "deployed=${DEPLOYED:-none}" >> "$GITHUB_OUTPUT"
          echo "matched=false" >> "$GITHUB_OUTPUT"
          echo "::error::Production never reached $EXPECTED. Not reporting platform health."
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The gate itself lives in scripts/verify-platform-health.mjs so the
      # decision is unit-tested rather than existing only as workflow shell.
      - name: Verify platform health
        id: health
        run: |
          set -uo pipefail
          OUTPUT="$(node scripts/verify-platform-health.mjs "$BASE_URL" 2>&1)"
          CODE=$?
          printf '%s\n' "$OUTPUT"
          SUMMARY="$(printf '%s\n' "$OUTPUT" | grep '^RESULT ' || echo 'RESULT platform_health=fail')"
          read_field() {
            printf '%s' "$SUMMARY" | tr ' ' '\n' | grep "^$1=" | cut -d= -f2- || true
          }
          {
            echo "http_status=$(read_field http)"
            echo "worker_health_complete=$(read_field worker_health_complete)"
            echo "job_supply=$(read_field job_supply)"
            echo "supply_state=$(read_field supply_state)"
            echo "capacity=$(read_field authorized_daily_capacity)"
            echo "target=$(read_field target_daily_new_canonical)"
            echo "missing_count=$(read_field missing_workers)"
            echo "unhealthy_count=$(read_field unhealthy_workers)"
          } >> "$GITHUB_OUTPUT"
          exit "$CODE"

      - name: Publish platform-health summary
        if: always()
        run: |
          {
            echo "## Platform health"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Tested production commit | \`${{ steps.match.outputs.deployed }}\` |"
            echo "| Commit matched | ${{ steps.match.outputs.matched || 'false' }} |"
            echo "| /api/health | HTTP ${{ steps.health.outputs.http_status }} |"
            echo "| Worker health complete | ${{ steps.health.outputs.worker_health_complete }} |"
            echo "| Missing workers | ${{ steps.health.outputs.missing_count }} |"
            echo "| Unhealthy workers | ${{ steps.health.outputs.unhealthy_count }} |"
            echo "| Platform health | ${{ steps.health.outcome }} |"
            echo "| Job-supply capacity | ${{ steps.health.outputs.job_supply }} — ${{ steps.health.outputs.supply_state }} (authorized ${{ steps.health.outputs.capacity }}/day vs target ${{ steps.health.outputs.target }}/day) |"
            echo
            if [ "${{ steps.health.outputs.job_supply }}" != "ready" ]; then
              echo "> Job-supply capacity is UNPROVEN and reported honestly. SalaryPadi does not hold authorised capacity for the daily target; this does not gate platform health, and is asserted by the production-freshness workflow."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
